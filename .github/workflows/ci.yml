name: ci
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  # Oldest and newest supported Elixir, ubuntu-latest has no OTP builds older than 26
  tests:
    name: test-kafka-${{ matrix.kafka }}-elixir-${{ matrix.beam.elixir }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        kafka: ["3.9", "4.4"]
        beam:
          - elixir: "1.20"
            otp: "28"
          - elixir: "1.15"
            otp: "26"
    steps:
      - uses: actions/checkout@v3
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ matrix.beam.elixir }}
          otp-version: ${{ matrix.beam.otp }}
      # returns once every broker is healthy and the SCRAM users exist
      - run: docker compose -f "test/compose_files/docker-compose-kafka-${{ matrix.kafka }}.yml" up -d --wait --wait-timeout 180
      - run: mix deps.get
      - run: MIX_ENV=prod mix compile --warnings-as-errors
      - run: mix test --warnings-as-errors
      - if: failure()
        run: docker compose -f "test/compose_files/docker-compose-kafka-${{ matrix.kafka }}.yml" logs --no-color
